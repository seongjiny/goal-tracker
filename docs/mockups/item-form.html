<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>새 항목 · Goal Tracker</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="stage"><section class="phone"><div class="status"><span>9:41</span><span>● ●● 100%</span></div><main class="content">
  <a class="back" href="items.html">‹ 항목 관리</a>
  <header class="top"><div><p class="eyebrow">Daily Item</p><h1>새 항목 추가</h1></div></header>
  <div class="field"><label for="title">항목 이름</label><input class="input" id="title" value="물 2L 마시기"></div>
  <div class="field"><span class="label">아이콘</span><div class="emoji-picker"><button class="selected">💧</button><button>🏃</button><button>💊</button><button>📚</button><button>🧘</button></div></div>
  <div class="field"><span class="label">색상</span><div class="color-picker"><button class="green selected" aria-label="초록"></button><button class="blue" aria-label="파랑"></button><button class="yellow" aria-label="노랑"></button><button class="pink" aria-label="분홍"></button><button class="purple" aria-label="보라"></button></div></div>
  <div class="field"><span class="label">반복</span><input class="input" value="매일 · 하루 1회" disabled></div>
  <p class="note">1차에서는 모든 항목이 매일 한 번 기록됩니다. 횟수와 반복 주기는 이후 단계에서 확장합니다.</p>
  <div class="button-stack"><button class="primary">저장</button><a class="secondary" href="items.html" style="text-align:center;text-decoration:none">취소</a></div>
</main></section></div><script src="mockups.js"></script></body>
</html>
